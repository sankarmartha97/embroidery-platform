openapi: 3.1.0
info:
  title: Embroidery Studio API
  version: 0.1.0-draft
  description: |
    Studio, digitizing-job, artifact and publication endpoints.
    Marketplace catalogue, checkout and subscription endpoints are part of the
    existing marketplace API and are not repeated here.
servers:
  - url: https://api.example.com/api/v1
security:
  - bearerAuth: []

tags:
  - name: Projects
    description: Design projects, drafts and duplication
  - name: Versions
    description: Immutable project versions
  - name: Collaborators
    description: Sharing a project with other users (owner only)
  - name: Jobs
    description: Digitize, simulate, validate and export jobs
  - name: Artifacts
    description: Generated files and authorized downloads
  - name: Publications
    description: Rights declarations, submission and moderation
  - name: Reference
    description: Machine profiles and supported formats

paths:
  /design-projects:
    post:
      tags: [Projects]
      summary: Create a project
      operationId: createProject
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectCreate' }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Project' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    get:
      tags: [Projects]
      summary: List projects visible to the caller (owned or shared)
      operationId: listProjects
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
        - name: scope
          in: query
          schema: { type: string, enum: [owned, shared, all], default: all }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ProjectStatus' }
      responses:
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '200':
          description: Page of projects
          content:
            application/json:
              schema:
                type: object
                required: [data, page]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Project' } }
                  page: { $ref: '#/components/schemas/PageInfo' }

  /design-projects/{id}:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    get:
      tags: [Projects]
      summary: Read project, current draft and caller permissions
      operationId: getProject
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ProjectDetail' } } } }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      tags: [Projects]
      summary: Update metadata (title, description, visibility, machine profile)
      operationId: updateProject
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectUpdate' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Project' } } } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /design-projects/{id}/draft:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    put:
      tags: [Projects]
      summary: Autosave the mutable draft document (optimistic concurrency)
      operationId: saveDraft
      parameters:
        - name: If-Match
          in: header
          required: true
          description: Current draftRevision as a quoted string, e.g. "17"
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectDocument' }
      responses:
        '200':
          description: Saved
          headers: { ETag: { schema: { type: string } } }
          content: { application/json: { schema: { type: object, properties: { draftRevision: { type: integer } } } } }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /design-projects/{id}/versions:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    post:
      tags: [Versions]
      summary: Snapshot the current draft as an immutable version
      operationId: createVersion
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                label: { type: string, maxLength: 120 }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/ProjectVersion' } } } }
        '200': { description: Draft identical to latest version; existing version returned, content: { application/json: { schema: { $ref: '#/components/schemas/ProjectVersion' } } } }
        '422': { $ref: '#/components/responses/Error' }
    get:
      tags: [Versions]
      summary: Version history
      operationId: listVersions
      parameters: [{ $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' }]
      responses:
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/ProjectVersion' } }
                  page: { $ref: '#/components/schemas/PageInfo' }

  /design-projects/{id}/versions/{versionId}/restore:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - { name: versionId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Versions]
      summary: Restore a version as the draft (a new head; the current draft is snapshotted first)
      description: |
        Same rights as editing the draft. The current draft is snapshotted (reason 'checkpoint',
        deduplicated by SHA-256) so nothing is lost, then the version's document becomes the draft.
        Optimistic concurrency like autosave.
      operationId: restoreVersion
      parameters:
        - name: If-Match
          in: header
          required: true
          description: Current draftRevision as a quoted string, e.g. "17"
          schema: { type: string }
      responses:
        '200':
          description: Restored
          headers: { ETag: { schema: { type: string } } }
          content: { application/json: { schema: { type: object, required: [draftRevision], properties: { draftRevision: { type: integer } } } } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /design-projects/{id}/collaborators:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    get:
      tags: [Collaborators]
      summary: Active collaborators (owner only)
      operationId: listCollaborators
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Collaborator' } }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    post:
      tags: [Collaborators]
      summary: Invite a user, or re-invite a revoked one (owner only)
      description: |
        Invites by user id until the marketplace user directory is available (OQ-03); FS-7.10
        invites by email. Inviting an active collaborator again is 409.
      operationId: addCollaborator
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CollaboratorCreate' }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Collaborator' } } } }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /design-projects/{id}/collaborators/{userId}:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [Collaborators]
      summary: Change role or export permission (owner only)
      operationId: updateCollaborator
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CollaboratorUpdate' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Collaborator' } } } }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Collaborators]
      summary: Revoke access (owner only); takes effect on the next request (SEC-T05)
      operationId: revokeCollaborator
      responses:
        '204': { description: Revoked }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /design-projects/{id}/duplicate:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    post:
      tags: [Projects]
      summary: Duplicate a project from a version (rights are not copied)
      operationId: duplicateProject
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                versionId: { type: string, format: uuid }
                title: { type: string }
      responses:
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Project' } } } }

  /design-projects/{id}/jobs:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    post:
      tags: [Jobs]
      summary: Queue a digitize, simulate, validate or export job
      operationId: createJob
      parameters: [{ $ref: '#/components/parameters/IdempotencyKeyRequired' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JobCreate' }
      responses:
        '202':
          description: Accepted
          headers:
            Location: { schema: { type: string }, description: '/digitizing-jobs/{jobId}' }
          content: { application/json: { schema: { $ref: '#/components/schemas/Job' } } }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /digitizing-jobs/{jobId}:
    parameters:
      - { name: jobId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Jobs]
      summary: Job status, progress and user-safe diagnostics
      operationId: getJob
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Job' } } } }
        '404': { $ref: '#/components/responses/Error' }

  /digitizing-jobs/{jobId}/cancel:
    parameters:
      - { name: jobId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Jobs]
      summary: Request cancellation (best effort for running jobs)
      operationId: cancelJob
      responses:
        '202': { description: Cancellation requested, content: { application/json: { schema: { $ref: '#/components/schemas/Job' } } } }
        '409': { $ref: '#/components/responses/Error' }

  /design-projects/{id}/artifacts:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    get:
      tags: [Artifacts]
      summary: List artifacts the caller may see
      operationId: listArtifacts
      parameters:
        - { name: versionId, in: query, schema: { type: string, format: uuid } }
        - { name: type, in: query, schema: { $ref: '#/components/schemas/ArtifactType' } }
      responses:
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Artifact' } }

  /artifacts/{artifactId}/download-url:
    parameters:
      - { name: artifactId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Artifacts]
      summary: Authorize a download and issue a short-lived signed URL
      description: Checks project access or marketplace entitlement. Every decision (allowed or denied) is recorded in design_export_events.
      operationId: createDownloadUrl
      responses:
        '200':
          description: Signed URL
          content:
            application/json:
              schema:
                type: object
                required: [url, expiresAt]
                properties:
                  url: { type: string, format: uri }
                  expiresAt: { type: string, format: date-time }
                  sha256: { type: string }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /artifacts/{artifactId}/stitch-data:
    parameters:
      - { name: artifactId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Artifacts]
      summary: Stitch data for the Studio simulator (project readers only)
      description: |
        Serves a stitch_data artifact (stitch-data format v1) as gzip-encoded JSON
        (Content-Encoding gzip). Artifacts are immutable: the ETag is the content SHA-256 and
        clients may cache it (If-None-Match → 304). Not a download: no export event is recorded.
      operationId: getStitchData
      responses:
        '200':
          description: Stitch data
          headers:
            ETag: { schema: { type: string } }
          content: { application/json: { schema: { type: object } } }
        '304': { description: Not modified }
        '404': { $ref: '#/components/responses/Error' }

  /artifacts/{artifactId}/report:
    parameters:
      - { name: artifactId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Artifacts]
      summary: Validation report for the Studio's issues panel (project readers only)
      description: Serves a report artifact as JSON. Immutable, so the ETag is the content SHA-256. Not a download; no export event.
      operationId: getReport
      responses:
        '200':
          description: Validation report
          content:
            application/json:
              schema:
                type: object
                required: [status, issues]
                properties:
                  status: { type: string, enum: [passed, warning, failed] }
                  issues:
                    type: array
                    items:
                      type: object
                      required: [code, severity]
                      properties:
                        code: { type: string, examples: [OUT_OF_HOOP, MISSING_TRIM] }
                        severity: { type: string, enum: [error, warning] }
                        count: { type: integer }
                        objectIds: { type: array, items: { type: string } }
                        message: { type: string }
                  machineProfile: { type: object }
        '304': { description: Not modified }
        '404': { $ref: '#/components/responses/Error' }

  /design-projects/{id}/rights:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    post:
      tags: [Publications]
      summary: Add a rights declaration for the design or an asset
      operationId: declareRights
      description: |
        Owner only (the owner submits). licensed and commissioned need rightsHolderName and
        sourceReference; public_domain needs sourceReference. assetId must be an asset of this
        project. Evidence upload waits for the upload pipeline (S8-03).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RightsDeclaration' }
      responses:
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/RightsRecord' } } } }
    get:
      tags: [Publications]
      summary: Rights declarations of a project (project readers and staff)
      operationId: listRights
      responses:
        '404': { $ref: '#/components/responses/Error' }
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/RightsRecord' } }

  /design-rights/{rightsId}/verification:
    parameters:
      - { name: rightsId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Publications]
      summary: Record a rights verification decision (staff.rights_admin)
      operationId: verifyRights
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [verified, rejected, disputed] }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/RightsRecord' } } } }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /design-projects/{id}/submit:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    post:
      tags: [Publications]
      summary: Submit a version for marketplace review
      operationId: submitProject
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [versionId, acceptCreatorTerms]
              properties:
                versionId: { type: string, format: uuid }
                acceptCreatorTerms: { type: boolean, const: true }
      description: |
        Owner only. Needs a design-level rights declaration (not rejected) plus one for every
        asset (RIGHTS_DECLARATION_REQUIRED), and a machine file of this version whose stitch data
        validated passed or warning (PASSING_EXPORT_REQUIRED). The project must be a draft with no
        open publication (409). Accepting the creator terms is recorded with a hashed IP.
      responses:
        '201': { description: Submitted, content: { application/json: { schema: { $ref: '#/components/schemas/Publication' } } } }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { description: Missing rights declarations or no passing export, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }

  /design-projects/{id}/publications:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    get:
      tags: [Publications]
      summary: Submission history of a project, newest first (project readers)
      operationId: listProjectPublications
      responses:
        '404': { $ref: '#/components/responses/Error' }
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Publication' } }

  /design-publications:
    get:
      tags: [Publications]
      summary: Moderation queue (staff.moderator), oldest submission first
      operationId: listPublications
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [submitted, in_review, changes_requested, approved, rejected, withdrawn, taken_down], default: submitted } }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '403': { $ref: '#/components/responses/Error' }
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, page]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/PublicationDetail' } }
                  page: { $ref: '#/components/schemas/PageInfo' }

  /design-publications/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Publications]
      summary: A publication with its project, rights and validation (moderators and project readers)
      operationId: getPublication
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PublicationDetail' } } } }
        '404': { $ref: '#/components/responses/Error' }

  /design-publications/{id}/review:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Publications]
      summary: Moderation decision (staff.moderator)
      operationId: reviewPublication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [approve, reject, request_changes] }
                reason: { type: string, maxLength: 1000, description: Required to reject or request changes }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Publication' } } } }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /machine-profiles:
    get:
      tags: [Reference]
      summary: System presets plus the caller's own profiles
      operationId: listMachineProfiles
      responses:
        '401': { $ref: '#/components/responses/Error' }
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/MachineProfile' } }

  /machine-formats:
    get:
      tags: [Reference]
      summary: Supported export formats and their capabilities
      operationId: listMachineFormats
      responses:
        '401': { $ref: '#/components/responses/Error' }
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/MachineFormat' } }

  /me/machines:
    get:
      tags: [Reference]
      summary: The caller's registered machines ("My Machine")
      operationId: listMyMachines
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/UserMachine' } }
        '401': { $ref: '#/components/responses/Error' }
    post:
      tags: [Reference]
      summary: Register a machine
      operationId: createMyMachine
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserMachineCreate' }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/UserMachine' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /artifacts/{artifactId}/stitch-outcomes:
    parameters:
      - { name: artifactId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Artifacts]
      summary: Report how a downloaded file stitched
      description: Allowed only for users who downloaded the artifact (or staff). Machine details are copied from userMachineId at report time.
      operationId: reportStitchOutcome
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StitchOutcomeCreate' }
      responses:
        '201': { description: Recorded }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }

  parameters:
    ProjectId: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    Cursor: { name: cursor, in: query, schema: { type: string } }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, maxLength: 128 }
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, maxLength: 128 }

  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  schemas:
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, correlationId]
          properties:
            code: { type: string, examples: [VALIDATION_FAILED, NOT_FOUND, FORBIDDEN, DRAFT_CONFLICT, STITCH_DATA_REQUIRED, RATE_LIMITED, IDEMPOTENCY_KEY_REUSED] }
            message: { type: string }
            correlationId: { type: string }
            details:
              type: array
              items:
                type: object
                properties:
                  path: { type: string }
                  issue: { type: string }

    PageInfo:
      type: object
      properties:
        nextCursor: { type: [string, 'null'] }

    ProjectStatus: { type: string, enum: [draft, in_review, published, archived] }
    Visibility: { type: string, enum: [private, shared, marketplace] }
    ArtifactType: { type: string, enum: [source, stitch_data, preview, machine_file, report] }
    JobType: { type: string, enum: [digitize, simulate, validate, export] }
    JobStatus: { type: string, enum: [queued, running, succeeded, failed, cancelled] }

    ProjectCreate:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string }
        machineProfileId: { type: string, format: uuid }

    ProjectUpdate:
      type: object
      minProperties: 1
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: [string, 'null'] }
        visibility: { type: string, enum: [private, shared], description: "'marketplace' is set only by publication" }
        machineProfileId: { type: [string, 'null'], format: uuid }

    Project:
      type: object
      properties:
        id: { type: string, format: uuid }
        ownerUserId: { type: string, format: uuid }
        title: { type: string }
        description: { type: [string, 'null'] }
        visibility: { $ref: '#/components/schemas/Visibility' }
        status: { $ref: '#/components/schemas/ProjectStatus' }
        currentVersionId: { type: [string, 'null'], format: uuid }
        draftRevision: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ProjectDetail:
      allOf:
        - $ref: '#/components/schemas/Project'
        - type: object
          properties:
            draft: { $ref: '#/components/schemas/ProjectDocument' }
            permissions:
              type: object
              properties:
                canEdit: { type: boolean }
                canExport: { type: boolean }
                canSubmit: { type: boolean }
                canManageCollaborators: { type: boolean }

    ProjectDocument:
      type: object
      description: Canonical project document. Full schema in 05-digitizing-engine.
      required: [schemaVersion, units, canvas, objects]
      properties:
        schemaVersion: { type: integer, minimum: 1 }
        units: { type: string, const: mm }
        canvas:
          type: object
          required: [width, height]
          properties:
            width: { type: number, exclusiveMinimum: 0 }
            height: { type: number, exclusiveMinimum: 0 }
        machineProfile: { type: object }
        objects: { type: array, maxItems: 5000, items: { type: object } }

    Collaborator:
      type: object
      required: [userId, role, canExport, invitedBy, createdAt]
      properties:
        userId: { type: string, format: uuid }
        role: { type: string, enum: [editor, viewer] }
        canExport: { type: boolean }
        invitedBy: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }

    CollaboratorCreate:
      type: object
      required: [userId, role]
      properties:
        userId: { type: string, format: uuid }
        role: { type: string, enum: [editor, viewer] }
        canExport: { type: boolean, default: false }

    CollaboratorUpdate:
      type: object
      minProperties: 1
      properties:
        role: { type: string, enum: [editor, viewer] }
        canExport: { type: boolean }

    ProjectVersion:
      type: object
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        versionNumber: { type: integer }
        documentSchemaVersion: { type: integer }
        documentSha256: { type: string }
        label: { type: [string, 'null'] }
        reason: { type: string }
        createdBy: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }

    JobCreate:
      type: object
      required: [jobType, versionId]
      properties:
        jobType: { $ref: '#/components/schemas/JobType' }
        versionId: { type: string, format: uuid }
        inputArtifactId:
          type: string
          format: uuid
          description: stitch_data artifact. Required for simulate/validate/export unless digitizeIfMissing is true.
        digitizeIfMissing: { type: boolean, default: false }
        targetFormat: { type: string, description: Required for export. One of /machine-formats. }
        machineProfileId: { type: string, format: uuid }
        settings: { type: object }

    Job:
      type: object
      properties:
        id: { type: string, format: uuid }
        jobType: { $ref: '#/components/schemas/JobType' }
        status: { $ref: '#/components/schemas/JobStatus' }
        progress: { type: integer, minimum: 0, maximum: 100 }
        projectVersionId: { type: string, format: uuid }
        inputArtifactId: { type: [string, 'null'], format: uuid }
        parentJobId: { type: [string, 'null'], format: uuid }
        targetFormat: { type: [string, 'null'] }
        engineName: { type: string }
        engineVersion: { type: [string, 'null'] }
        attemptCount: { type: integer }
        error:
          type: [object, 'null']
          properties:
            code: { type: string }
            summary: { type: string }
        outputArtifactIds: { type: array, items: { type: string, format: uuid } }
        createdAt: { type: string, format: date-time }
        startedAt: { type: [string, 'null'], format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }

    Artifact:
      type: object
      properties:
        id: { type: string, format: uuid }
        projectVersionId: { type: string, format: uuid }
        jobId: { type: [string, 'null'], format: uuid }
        artifactType: { $ref: '#/components/schemas/ArtifactType' }
        formatCode: { type: string }
        sha256: { type: string }
        fileSizeBytes: { type: integer }
        stitchCount: { type: [integer, 'null'] }
        colorCount: { type: [integer, 'null'] }
        widthMm: { type: [number, 'null'] }
        heightMm: { type: [number, 'null'] }
        engineName: { type: [string, 'null'] }
        engineVersion: { type: [string, 'null'] }
        validationStatus: { type: string, enum: [pending, passed, warning, failed] }
        validationReportArtifactId:
          type: [string, 'null']
          format: uuid
          description: On stitch_data, the report artifact of its latest validate job
        createdAt: { type: string, format: date-time }

    RightsDeclaration:
      type: object
      required: [rightsType]
      properties:
        assetId: { type: [string, 'null'], format: uuid }
        rightsType: { type: string, enum: [owned, licensed, commissioned, public_domain] }
        rightsHolderName: { type: string }
        sourceReference: { type: string, maxLength: 500 }
        licenseTermsVersion: { type: string }
        commercialUseAllowed: { type: boolean }
        modificationAllowed: { type: boolean }
        redistributionAllowed: { type: boolean }

    RightsRecord:
      type: object
      required: [id, projectId, assetId, rightsType, declaredBy, verificationStatus, createdAt]
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        assetId: { type: [string, 'null'], format: uuid }
        rightsType: { type: string, enum: [owned, licensed, commissioned, public_domain] }
        rightsHolderName: { type: [string, 'null'] }
        sourceReference: { type: [string, 'null'] }
        licenseTermsVersion: { type: [string, 'null'] }
        commercialUseAllowed: { type: boolean }
        modificationAllowed: { type: boolean }
        redistributionAllowed: { type: boolean }
        declaredBy: { type: string, format: uuid }
        verificationStatus: { type: string, enum: [declared, verified, rejected, disputed] }
        verifiedBy: { type: [string, 'null'], format: uuid }
        verifiedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }

    Publication:
      type: object
      required: [id, projectId, projectVersionId, status, submittedBy, submittedAt]
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        projectVersionId: { type: string, format: uuid }
        status: { type: string, enum: [submitted, in_review, changes_requested, approved, rejected, withdrawn, taken_down] }
        submittedBy: { type: string, format: uuid }
        reviewerUserId: { type: [string, 'null'], format: uuid }
        decisionReason: { type: [string, 'null'] }
        submittedAt: { type: string, format: date-time }
        decidedAt: { type: [string, 'null'], format: date-time }

    PublicationDetail:
      allOf:
        - $ref: '#/components/schemas/Publication'
        - type: object
          required: [project, versionNumber, rights]
          properties:
            project:
              type: object
              required: [id, title, ownerUserId]
              properties:
                id: { type: string, format: uuid }
                title: { type: string }
                description: { type: [string, 'null'] }
                ownerUserId: { type: string, format: uuid }
            versionNumber: { type: integer }
            validationStatus: { type: [string, 'null'], enum: [pending, passed, warning, failed, null] }
            rights: { type: array, items: { $ref: '#/components/schemas/RightsRecord' } }

    MachineProfile:
      type: object
      required: [id, name, format, hoopWidthMm, hoopHeightMm, isSystemPreset]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        format: { type: string, description: One of /machine-formats }
        hoopWidthMm: { type: number }
        hoopHeightMm: { type: number }
        minStitchLengthMm: { type: number }
        maxStitchLengthMm: { type: number }
        maxJumpLengthMm: { type: [number, 'null'] }
        trimJumpThresholdMm: { type: [number, 'null'], description: Jumps longer than this get a trim }
        maxColors: { type: [integer, 'null'] }
        isSystemPreset: { type: boolean }

    MachineFormat:
      type: object
      required: [code, name, extension, colourInfo, productionEnabled]
      properties:
        code: { type: string, examples: [DST] }
        name: { type: string }
        extension: { type: string }
        colourInfo: { type: string, enum: [stops-only, embedded-palette, palette-index] }
        maxStitchMm: { type: [number, 'null'] }
        productionEnabled: { type: boolean, description: True only after the production enablement gate (05-digitizing-engine/format-support.md) }

    Hoop:
      type: object
      required: [name, widthMm, heightMm]
      properties:
        name: { type: string, maxLength: 40, examples: ['5x7'] }
        widthMm: { type: number, exclusiveMinimum: 0 }
        heightMm: { type: number, exclusiveMinimum: 0 }

    UserMachineCreate:
      type: object
      required: [machineBrand, machineModel, preferredFormat, hoops]
      properties:
        nickname: { type: string, maxLength: 80 }
        machineBrand: { type: string, maxLength: 80 }
        machineModel: { type: string, maxLength: 120 }
        preferredFormat: { type: string, description: One of /machine-formats }
        hoops: { type: array, minItems: 1, maxItems: 20, items: { $ref: '#/components/schemas/Hoop' } }
        isDefault: { type: boolean, default: false }

    UserMachine:
      allOf:
        - $ref: '#/components/schemas/UserMachineCreate'
        - type: object
          properties:
            id: { type: string, format: uuid }
            machineProfileId: { type: [string, 'null'], format: uuid }

    StitchOutcomeCreate:
      type: object
      required: [outcome]
      properties:
        userMachineId: { type: string, format: uuid }
        outcome: { type: string, enum: [success, minor_issues, failed, did_not_stitch] }
        rating: { type: integer, minimum: 1, maximum: 5 }
        issueCodes:
          type: array
          uniqueItems: true
          items: { type: string, enum: [wont_open, too_big_for_hoop, puckering, gaps, thread_breaks, registration, density_too_high, too_many_trims, other] }
        fabricType: { type: string, enum: [woven_cotton, knit, towel, denim, canvas, cap, felt, leather, other] }
        stabilizerType: { type: string, enum: [cutaway, tearaway, washaway, heat_away, none, other] }
        threadBrand: { type: string, maxLength: 80 }
        threadWeight: { type: string, maxLength: 20 }
        needle: { type: string, maxLength: 40 }
        comment: { type: string, maxLength: 2000 }
        photoUploadIds: { type: array, maxItems: 4, items: { type: string, format: uuid }, description: Ids from the presigned upload flow; never storage paths }
        photoConsent: { type: string, enum: [private, support_only, public_review], default: private }
