name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: embroidery
          MYSQL_USER: emb
          MYSQL_PASSWORD: emb
        ports: ['3307:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=3s --health-retries=30
      localstack:
        image: localstack/localstack:3.8
        env:
          SERVICES: sqs,s3
          AWS_DEFAULT_REGION: eu-west-1
          S3_SKIP_SIGNATURE_VALIDATION: '0'
        ports: ['4566:4566']
    env:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: eu-west-1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: npm ci
      - name: Lint and format check
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Prepare test database
        run: |
          mysql -h 127.0.0.1 -P 3307 -uroot -proot -e "
            CREATE DATABASE IF NOT EXISTS embroidery_test CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci;
            GRANT ALL PRIVILEGES ON embroidery_test.* TO 'emb'@'%'; FLUSH PRIVILEGES;"
      - name: Prepare queues and buckets
        run: |
          for i in $(seq 1 30); do aws --endpoint-url http://localhost:4566 sqs list-queues && break; sleep 2; done
          aws --endpoint-url http://localhost:4566 sqs create-queue --queue-name emb-jobs-dlq
          aws --endpoint-url http://localhost:4566 sqs create-queue --queue-name emb-jobs
          aws --endpoint-url http://localhost:4566 s3 mb s3://emb-artifacts-local
      - name: Integration tests
        run: npm run test:integration
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Web - install, lint, unit tests, build
        working-directory: web
        run: |
          npm ci
          npm run lint
          npm test
          npm run build
          npm audit --omit=dev --audit-level=high
      - name: E2E - start API, worker and web
        run: |
          # Local dev settings plus a dev signing key and the designer role for the dev user.
          grep -v -E '^(AUTH_JWT_PUBLIC_KEY|AUTH_JWT_ALGORITHMS|DEV_ROLE_ASSIGNMENTS)=' .env.example > .env
          npm run -s dev:token -- --setup | grep '^AUTH_JWT' >> .env
          echo 'DEV_ROLE_ASSIGNMENTS={"0190f0a0-0000-7000-8000-00000000de11":["designer"],"0190f0a0-0000-7000-8000-00000000de13":["staff.moderator"]}' >> .env
          npm run db:migrate
          mysql -h 127.0.0.1 -P 3307 -uemb -pemb embroidery \
            -e "INSERT IGNORE INTO users (id) VALUES ('0190f0a0-0000-7000-8000-00000000de11'), ('0190f0a0-0000-7000-8000-00000000de12'), ('0190f0a0-0000-7000-8000-00000000de13')"
          nohup node --env-file=.env src/server.js > api.log 2>&1 &
          nohup node --env-file=.env workers/main.js > worker.log 2>&1 &
          (cd web && API_ORIGIN=http://127.0.0.1:3000 NEXT_TELEMETRY_DISABLED=1 nohup npx next dev -p 5001 > ../web.log 2>&1 &)
          for i in $(seq 1 60); do curl -sf localhost:3000/ready && curl -sf -o /dev/null localhost:5001/sign-in && break; sleep 2; done
      - name: E2E - Playwright
        working-directory: web
        run: |
          npx playwright install --with-deps chromium
          MODERATOR_ID=0190f0a0-0000-7000-8000-00000000de13
          E2E_TOKEN=$(cd .. && npm run -s dev:token) \
          E2E_MODERATOR_TOKEN=$(cd .. && npm run -s dev:token -- "$MODERATOR_ID") \
            npm run e2e
      - name: E2E - logs on failure
        if: failure()
        run: tail -n 100 api.log worker.log web.log || true
